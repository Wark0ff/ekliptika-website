# Эклиптика — конфиг Nginx (реверс-прокси на Next.js), домен ekliptika.art.
# Путь на сервере: /etc/nginx/sites-available/ekliptika
#
# Здесь только блок для порта 80. Блок 443 без сертификата нельзя класть заранее:
# `nginx -t` падает, и на общем сервере reload ломается у всех сайтов.
# `certbot --nginx --redirect` сам допишет 443 (копия этого блока + пути к
# сертификату) и превратит этот блок в редирект на https.

server {
    listen 80;
    listen [::]:80;
    server_name ekliptika.art www.ekliptika.art;

    # Раздача проверочных файлов Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ── Заголовки безопасности ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;

    # Сжатие
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # 10m — под загрузку фото в админке (фото с телефона 3–8 МБ);
    # при 2m nginx резал бы их 413 до приложения.
    client_max_body_size 10m;

    # Статика Next.js иммутабельна, кэшируем надолго.
    # add_header внутри location отменяет заголовки уровня server, поэтому
    # nosniff повторён здесь.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Всё остальное — на Node-приложение
    # www → основной домен. Редирект стоит внутри location, а не на уровне
    # server, чтобы не перехватить проверку Let's Encrypt для www.
    location / {
        if ($host = www.ekliptika.art) {
            return 301 https://ekliptika.art$request_uri;
        }
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
